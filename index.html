<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Girl AR - Drag & Drop! ✨</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
      /* Clean, light-mode Apple-style aesthetic 🍏 */
      body, html { margin: 0; padding: 0; height: 100%; background-color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      model-viewer { width: 100%; height: 100%; }
    </style>
  </head>
  <body>

    <!-- Swapped in animegirl2.glb 👇 -->
    <model-viewer 
      src="animegirl2.glb" 
      ar 
      ar-modes="scene-viewer webxr quick-look" 
      camera-controls 
      autoplay
      shadow-intensity="1">
      
      <button slot="ar-button" style="background-color: white; color: #1d1d1f; border-radius: 980px; border: 1px solid #d2d2d7; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 14px 28px; font-weight: 600; font-size: 16px; box-shadow: 0px 4px 15px rgba(0,0,0,0.08); cursor: pointer;">
        View in your space 🪄
      </button>

    </model-viewer>

  </body>
</html>
