<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>True Surface Tracking AR 🚀</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-ar-hit-test@1.1.1/dist/aframe-ar-hit-test.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      #ui-container { position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
      .btn { padding: 10px 20px; background: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
  </head>
  <body>

    <div id="ui-container">
      <button class="btn" id="place-btn">Tap to Place Aqua! 💧</button>
    </div>

    <a-scene webxr="requiredFeatures: hit-test, local-floor;">
      
      <a-assets>
        <a-asset-item id="aqua-model" src="aqua.glb"></a-asset-item>
      </a-assets>

      <a-entity 
        id="reticle" 
        geometry="primitive: ring; radiusInner: 0.15; radiusOuter: 0.2" 
        rotation="-90 0 0" 
        material="color: white; shader: flat"
        ar-hit-test="target: #model-container;">
      </a-entity>

      <a-entity id="model-container" position="0 0 -2">
        <a-entity
          id="aqua"
          gltf-model="#aqua-model"
          scale="0.2 0.2 0.2"
          animation-mixer
          visible="false"> </a-entity>
      </a-entity>

      <a-entity camera></a-entity>

    </a-scene>

    <script>
      // Script to make her appear exactly where the white square is!
      document.getElementById('place-btn').addEventListener('click', () => {
        const aqua = document.getElementById('aqua');
        aqua.setAttribute('visible', 'true');
      });
    </script>

  </body>
</html>
