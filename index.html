<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>True AR - Tap to Place! 🎯💧</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/aframe-ar-hit-test@1.1.1/dist/aframe-ar-hit-test.min.js"></script>
    
    <script>
      // 🧠 OUR CUSTOM LOGIC: Wait for a tap, then place Aqua!
      AFRAME.registerComponent('tap-to-place', {
        init: function () {
          const reticle = document.getElementById('reticle');
          const aqua = document.getElementById('aqua');

          // Listen for a screen tap ('select' event in WebXR)
          this.el.sceneEl.addEventListener('select', () => {
            
            // Only place her if the white ring has found the floor!
            if (reticle.getAttribute('visible')) {
              
              // 1. Get the 3D position of the white ring
              const position = reticle.getAttribute('position');
              
              // 2. Move Aqua to that exact coordinate
              aqua.setAttribute('position', position);
              
              // 3. Make her visible!
              aqua.setAttribute('visible', 'true');
              
              // 🔥 Pro Move: Hide the reticle after placing her so it looks super clean!
              reticle.setAttribute('visible', 'false');
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene 
      tap-to-place
      webxr="requiredFeatures: hit-test, local-floor;">
      
      <a-assets>
        <a-asset-item id="aqua-model" src="aqua.glb"></a-asset-item>
      </a-assets>

      <a-entity 
        id="reticle" 
        ar-hit-test 
        geometry="primitive: ring; radiusInner: 0.15; radiusOuter: 0.2" 
        rotation="-90 0 0" 
        material="color: white; shader: flat">
      </a-entity>

      <a-entity
        id="aqua"
        gltf-model="#aqua-model"
        scale="0.2 0.2 0.2"
        animation-mixer
        visible="false">
      </a-entity>

      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
