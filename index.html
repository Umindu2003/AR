<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      html, body { margin: 0; overflow: hidden; height: 100%; background: #000; }
      #arCamera {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 0;
      }
      a-scene { position: fixed; top: 0; left: 0; z-index: 1; }
      #hint {
        position: fixed; bottom: 20px; left: 50%;
        transform: translateX(-50%);
        color: #fff; background: rgba(0,0,0,0.6);
        padding: 8px 16px; border-radius: 20px;
        font-family: sans-serif; font-size: 13px;
        z-index: 2; text-align: center; pointer-events: none;
      }
    </style>
  </head>
  <body>

    <video id="arCamera" autoplay playsinline muted></video>
    <div id="hint">Drag to move · Pinch to resize · Twist to rotate</div>

    <a-scene embedded renderer="alpha:true" vr-mode-ui="enabled: false">

      <a-assets>
        <a-asset-item id="aqua-model" src="aqua.glb"></a-asset-item>
      </a-assets>

      <a-entity
        id="model"
        gltf-model="#aqua-model"
        scale="0.2 0.2 0.2"
        position="0 0 -2"
        rotation="0 0 0"
        animation-mixer
        placeable>
      </a-entity>

      <a-entity camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>

    </a-scene>

    <script>
      // Get the live back camera feed and use it as background
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then(stream => {
          document.getElementById('arCamera').srcObject = stream;
        })
        .catch(err => {
          alert("Camera access failed: " + err.message);
        });

      // Custom component: drag to move, pinch to scale, twist to rotate
      AFRAME.registerComponent('placeable', {
        init: function () {
          this.dragStart = null;
          this.startPos = null;
          this.startDist = null;
          this.startAngle = null;
          this.startScale = null;
          this.startRotY = null;

          const canvas = this.el.sceneEl.canvas;
          canvas.style.touchAction = 'none';
          canvas.addEventListener('touchstart', this.onTouchStart.bind(this), { passive: false });
          canvas.addEventListener('touchmove', this.onTouchMove.bind(this), { passive: false });
          canvas.addEventListener('touchend', this.onTouchEnd.bind(this));
        },
        onTouchStart: function (e) {
          if (e.touches.length === 1) {
            this.dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            this.startPos = this.el.object3D.position.clone();
          } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            this.startDist = Math.sqrt(dx * dx + dy * dy);
            this.startAngle = Math.atan2(dy, dx);
            this.startScale = this.el.object3D.scale.clone();
            this.startRotY = this.el.object3D.rotation.y;
          }
        },
        onTouchMove: function (e) {
          e.preventDefault();
          if (e.touches.length === 1 && this.dragStart) {
            const dx = (e.touches[0].clientX - this.dragStart.x) * 0.005;
            const dy = (e.touches[0].clientY - this.dragStart.y) * 0.005;
            this.el.object3D.position.x = this.startPos.x + dx;
            this.el.object3D.position.z = this.startPos.z + dy;
          } else if (e.touches.length === 2 && this.startDist) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const scaleFactor = dist / this.startDist;
            const s = Math.max(0.02, this.startScale.x * scaleFactor);
            this.el.object3D.scale.set(s, s, s);

            const angle = Math.atan2(dy, dx);
            const rotDelta = angle - this.startAngle;
            this.el.object3D.rotation.y = this.startRotY + rotDelta;
          }
        },
        onTouchEnd: function (e) {
          if (e.touches.length === 0) {
            this.dragStart = null;
            this.startDist = null;
          }
        }
      });
    </script>

  </body>
</html>
