<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua AR - Drag & Drop! 💧</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
      body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; }
      model-viewer { width: 100%; height: 100%; }
    </style>
  </head>
  <body>

    <model-viewer 
      src="aqua.glb" 
      ar 
      ar-modes="scene-viewer webxr quick-look" 
      camera-controls 
      autoplay
      shadow-intensity="1">
      
      <button slot="ar-button" style="background-color: white; border-radius: 8px; border: none; position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 12px 24px; font-weight: bold; box-shadow: 0px 4px 10px rgba(0,0,0,0.25); cursor: pointer;">
        View in your space 🪄
      </button>

    </model-viewer>

  </body>
</html>
